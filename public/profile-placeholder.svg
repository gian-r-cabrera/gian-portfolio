<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
  <title id="title">Profile photo frame</title>
  <desc id="desc">Illustrative portrait frame for use until a real profile photo is supplied.</desc>
  <defs>
    <linearGradient id="bg" x1="88" x2="632" y1="48" y2="852" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9F1" />
      <stop offset="1" stop-color="#EFE5D8" />
    </linearGradient>
    <linearGradient id="accent" x1="120" x2="586" y1="128" y2="768" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B6E61" />
      <stop offset="1" stop-color="#BA6F4D" />
    </linearGradient>
  </defs>
  <rect width="720" height="900" rx="48" fill="url(#bg)" />
  <rect x="48" y="48" width="624" height="804" rx="36" fill="none" stroke="#163730" stroke-opacity=".14" />
  <circle cx="360" cy="304" r="122" fill="url(#accent)" fill-opacity=".18" />
  <circle cx="360" cy="282" r="84" fill="#163730" fill-opacity=".82" />
  <path d="M196 632c0-95.544 77.456-173 173-173h0c95.544 0 173 77.456 173 173v36H196v-36Z" fill="#163730" fill-opacity=".82" />
  <rect x="120" y="728" width="480" height="64" rx="16" fill="#FFF" fill-opacity=".72" />
  <text x="360" y="769" text-anchor="middle" fill="#163730" font-size="28" font-family="Avenir Next, Segoe UI, sans-serif" font-weight="600">
    Profile photo frame
  </text>
  <text x="360" y="108" text-anchor="middle" fill="#1B6E61" font-size="18" font-family="Avenir Next, Segoe UI, sans-serif" font-weight="700" letter-spacing="6">
    PROFILE PHOTO
  </text>
