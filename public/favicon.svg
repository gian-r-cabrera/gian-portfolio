<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="favicon-title favicon-desc">
  <title id="favicon-title">Gian Cabrera monogram</title>
  <desc id="favicon-desc">A compact GC mark for the portfolio browser tab.</desc>
  <defs>
    <linearGradient id="bg" x1="16" x2="80" y1="10" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED" />
      <stop offset="1" stop-color="#F0E4D3" />
    </linearGradient>
    <linearGradient id="ring" x1="18" x2="78" y1="18" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B6E61" />
      <stop offset="1" stop-color="#163730" />
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="28" fill="url(#bg)" />
  <rect x="11" y="11" width="74" height="74" rx="22" fill="#163730" opacity=".98" />
  <rect x="15" y="15" width="66" height="66" rx="18" fill="none" stroke="url(#ring)" stroke-width="2.5" opacity=".9" />
  <circle cx="72" cy="26" r="4.2" fill="#BA6F4D" opacity=".95" />
  <text
    x="48"
    y="56"
    text-anchor="middle"
    fill="#FFF9F1"
    font-family="Iowan Old Style, Georgia, serif"
    font-size="30"
    font-weight="700"
    letter-spacing="-1.4"
  >
    GC
  </text>
</svg>
